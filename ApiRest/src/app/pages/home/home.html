<div class="container mt-5 d-flex flex-column justify-content-center align-items-center text-center">

    <h1 class="fw-bold mt-5">FerroAtlántica</h1>
    <p class="text-muted mb-5">Sistema de Gestión de Usuarios</p>

    <div class="row g-4 w-100 justify-content-center mb-5">

        <!-- Gestionar Usuarios -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <i class="bi bi-people-fill fs-1 text-primary mb-3"></i>
                    <h5 class="fw-bold">Usuarios</h5>
                    <p class="text-muted small">Gestionar empleados</p>
                    <a [routerLink]="['/usuarios']" class="btn btn-primary w-100">
                        Ver usuarios
                    </a>
                </div>
            </div>
        </div>

        <!-- Nuevo Usuario -->
        <div class="col-md-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <i class="bi bi-person-plus-fill fs-1 text-success mb-3"></i>
                    <h5 class="fw-bold">Nuevo usuario</h5>
                    <p class="text-muted small">Añadir empleado</p>
                    <a [routerLink]="['/formulario']" class="btn btn-success w-100">
                        Crear usuario
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Imagen debajo -->
    <img
        src="https://erriberrisl.com/wp-content/uploads/2022/02/ferro-atlantica.png"
        alt="FerroAtlántica"
        class="img-fluid"
        style="max-width: 300px;"
    >

</div>
