<!-- hero-card.html -->
<div class="card h-100">
  <img 
    [src]="hero.image1 || 'https://via.placeholder.com/300x400'" 
    class="card-img-top" 
    [alt]="hero.heroname"
    style="height: 300px; object-fit: cover;">
  
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{ hero.heroname }}</h5>
    <p class="card-text text-muted">{{ hero.fullname }}</p>
    
    <div class="mt-auto">
      <div class="mb-2">
        <span class="badge bg-secondary me-1">{{ hero.race }}</span>
        <span class="badge" 
          [class.bg-success]="hero.alignment === 'good'"
          [class.bg-danger]="hero.alignment === 'bad'"
          [class.bg-warning]="hero.alignment === 'neutral'">
          {{ hero.alignment }}
        </span>
      </div>
      
      <div class="d-flex gap-2">
        <a [routerLink]="['/heroe', hero.id]" class="btn btn-sm btn-info flex-fill">
          Ver Detalles
        </a>
        <a [routerLink]="['/formulario', hero.id]" class="btn btn-sm btn-warning flex-fill">
          Editar
        </a>
      </div>
    </div>
  </div>
</div>
