<section>
    <ul>
        @for(estudiante of estudiantes; track estudiante.id; let i =$index; let par = $even) {
            <li class="estudiante" [class.par]="par" [class.impar]="!par">
                <span>{{i}}: </span>
                <span><strong>Nombre:  </strong>{{estudiante.name }}</span>
                <span><strong> --Edad:  </strong>{{estudiante.age }}</span>
            </li>
        }@empty {
            <li>No hay estudiantes</li>
        }
    </ul>
    <button (click)="agregarEstudiante()">Agregar Estudiante</button>
</section>
