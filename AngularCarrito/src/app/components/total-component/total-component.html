<section class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h3 class="mb-3">Total</h3>
            
            @for(item of productosEnCarrito; track item.sku) {
                <div class="d-flex justify-content-between py-2 border-bottom">
                    <div>
                        <strong>{{item.title}}</strong>
                        <span class="text-muted"> - {{item.cantidad}} unidades</span>
                    </div>
                    <strong>{{calcularSubtotal(item)}}{{moneda}}</strong>
                </div>
            }
            
            @if(productosEnCarrito.length === 0) {
                <p class="text-center text-muted my-4">No hay productos en el carrito</p>
            }

            <div class="d-flex justify-content-between mt-3 pt-3 border-top">
                <h4>TOTAL</h4>
                <h4 class="text-success">{{obtenerTotal()}}{{moneda}}</h4>
            </div>
            
            @if(productosEnCarrito.length > 0) {
                <button class="btn btn-danger w-100 mt-3" (click)="vaciarCarrito()">
                    Vaciar Carrito
                </button>
            }
        </div>
    </div>
</section>
