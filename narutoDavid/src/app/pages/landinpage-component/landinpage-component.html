<div class="bg-primary text-white text-center py-5">
        <div class="container">
            <h1 class="display-4">Bienvenido al Naruto</h1>
            <p class="lead">Descubre el mundo de ninjas y villanos</p>
            <button class="btn btn-light btn-lg mt-3" data-bs-toggle="modal" data-bs-target="#loginModal" [routerLink]="['/login']">
                Comenzar
            </button>
        </div>
    </div>

    <!-- Content -->
    <div class="container my-5">
        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Ninjas</h5>
                        <p class="card-text">Conoce a los ninjas más poderosos</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Villanos</h5>
                        <p class="card-text">Descubre a los villanos más temibles</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-3">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Estadísticas</h5>
                        <p class="card-text">Analiza sus poderes y habilidades</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
