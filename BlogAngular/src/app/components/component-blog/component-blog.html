<section class="container my-5 text-light starwars-section">
  <div class="row g-4">
    <!-- Formulario -->
    <div class="col-lg-5 col-md-6">
      <div class="p-4 rounded-4 shadow-lg bg-dark bg-opacity-75 border border-warning">
        <h1 class="mb-4 text-warning text-center fw-bold starwars-title">
          Nueva Noticia 
        </h1>

        <div class="mb-3">
          <label for="titulo" class="form-label fw-semibold text-warning">Título</label>
          <input
            type="text"
            id="titulo"
            class="form-control bg-black text-light border-warning"
            placeholder="Escribe el título"
            [(ngModel)]="nuevaNoticia.titulo"
            name="titulo"
          >
        </div>

        <div class="mb-3">
          <label for="imagen" class="form-label fw-semibold text-warning">Imagen</label>
          <input
            type="url"
            id="imagen"
            class="form-control bg-black text-light border-warning"
            placeholder="Pega la URL de la imagen"
            [(ngModel)]="nuevaNoticia.imagen"
            name="imagen"
          >
        </div>

        <div class="mb-3">
          <label for="cuerpo" class="form-label fw-semibold text-warning">Cuerpo</label>
          <textarea
            id="cuerpo"
            class="form-control bg-black text-light border-warning"
            rows="3"
            placeholder="Escribe el contenido de la noticia"
            [(ngModel)]="nuevaNoticia.cuerpo"
            name="cuerpo"
          ></textarea>
        </div>

        <div class="mb-3">
          <label for="fecha" class="form-label fw-semibold text-warning">Fecha</label>
          <input
            type="date"
            id="fecha"
            class="form-control bg-black text-light border-warning"
            [(ngModel)]="nuevaNoticia.Fecha"
            name="fecha"
          >
        </div>

        <div class="d-grid mt-4">
          <button class="btn btn-warning  rounded-pill " (click)="agregarNoticia()">
            Agregar Noticia
          </button>
        </div>
      </div>
    </div>

    <!-- Listado de noticias -->
    <div class="col-lg-7 col-md-6">
      <div class="row row-cols-1 row-cols-md-2 g-4">
        @for (noticia of noticias; track noticia.titulo) {
          <div class="col">
            <div class="card h-100 border border-warning rounded-4 overflow-hidden hover-card bg-black text-light shadow-lg">
              <img [src]="noticia.imagen" class="card-img-top border-bottom border-warning" alt="Imagen de la noticia" style="height: 180px; object-fit: cover;">
              <div class="card-body">
                <h5 class="card-title fw-bold text-warning starwars-title">{{ noticia.titulo }}</h5>
                <p class="card-text text-light-50">{{ noticia.cuerpo }}</p>
                <p class="card-text">
                  <small class="text-info">
                    {{ noticia.Fecha | date:'dd/MM/yyyy' }}
                  </small>
                </p>
              </div>
              <div class="card-footer bg-transparent border-0 text-end">
                <button class="btn btn-outline-danger btn-sm " (click)="eliminarNoticia(noticia.id)">
                   Eliminar
                </button>
              </div>
            </div>
          </div>
        }
      </div>
    </div>
  </div>
</section>
