<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Real Racing Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Real Racing Club</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/conocenos">Conócenos</a></li>
        <li class="nav-item"><a class="nav-link" href="/historia">Historia</a></li>
        <li class="nav-item"><a class="nav-link" href="/plantilla">Plantilla</a></li>
        <li class="nav-item"><a class="nav-link" href="/contacto">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>


<div class="container mt-5">
    <h1 class="text-center mb-4">Contacto</h1>

    <form class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" placeholder="nombre@ejemplo.com">
        </div>

        <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4" placeholder="Escribe tu mensaje"></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">Enviar</button>
    </form>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <p class="m-0">© 2025 Real Racing Club de Santander</p>
</footer>


</body>
</html>
