<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Real Racing Club</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/">Real Racing Club</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/conocenos">Conócenos</a></li>
        <li class="nav-item"><a class="nav-link" href="/historia">Historia</a></li>
        <li class="nav-item"><a class="nav-link active" href="/contacto">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container mt-5">

    <h1 class="text-center mb-4">Contacto</h1>

    <div th:if="${param.ok}" class="alert alert-success text-center">
        Mensaje enviado correctamente.
    </div>

    <form th:action="@{/contacto}" method="post" class="mx-auto" style="max-width: 500px;">
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input name="nombre" type="text" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input name="email" type="email" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mensaje</label>
            <textarea name="mensaje" class="form-control" rows="4" required></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100">Enviar</button>
    </form>
</div>

<footer class="bg-dark text-white text-center py-3 mt-auto">
    © 2025 Real Racing Club de Santander
</footer>

</body>
</html>
