<div class="container mt-5">

  <!-- FILTROS -->
  <app-filter (filtroSeleccionado)="cambiarFiltro($event)"></app-filter>
  <!-- LISTADO FILTRADO -->
@if(authService.isAdmin()){
    <div class="row mt-4 mb-5">
      @for (producto of productosFiltrados; track producto.id) {
        <article class="col-12 col-sm-6 col-md-4 mb-3">
          <app-card-component [producto]="producto" (deleted)="onDeleted($event)"></app-card-component>
        </article>
      }
    </div>
  } @else {
    <div class="row mt-4 mb-5">
      @for (producto of productosFiltrados; track producto.id) {
        @if (producto.active) {
          <article class="col-12 col-sm-6 col-md-4 mb-3">
            <app-card-component [producto]="producto" (deleted)="onDeleted($event)"></app-card-component>
          </article>
        }
      } @empty {
        <h3>No hay productos disponibles</h3>
      }
    </div>
  }

  

</div>
